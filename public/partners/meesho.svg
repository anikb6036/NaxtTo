<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%">
  <!-- Meesho App Icon Squircle + Wordmark -->
  <g transform="translate(10, 5)">
    <!-- Plum/Wine Squircle Background -->
    <rect x="0" y="0" width="60" height="60" rx="15" fill="#520f38" />
    <!-- Yellow/Orange 'm' icon -->
    <path
      d="M 18 43 
         L 18 28 
         C 18 23, 23 20, 27 24 
         C 28.5 25.5, 30 27.5, 30 30 
         C 30 27.5, 31.5 25.5, 33 24 
         C 37 20, 42 23, 42 28 
         L 42 43"
      fill="none"
      stroke="#f5a623"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M 30 30 L 30 43" stroke="#f5a623" stroke-width="5.5" stroke-linecap="round" />
    <!-- Small meesho text beneath m inside icon -->
    <text x="30" y="53" fill="#ffffff" font-size="7.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.2">meesho</text>
  </g>

  <!-- Bold Meesho Brand Text -->
  <text x="82" y="44" fill="#242424" font-size="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="-0.8">Meesho</text>
</svg>
