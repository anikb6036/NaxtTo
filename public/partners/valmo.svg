<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%">
  <!-- Valmo Logo Icon + Wordmark matching Valmo (Meesho Logistics) -->
  <g transform="translate(10, 5)">
    <!-- Black Circle Badge -->
    <circle cx="30" cy="30" r="30" fill="#0b0e14" />
    
    <!-- 3D Isometric Cube / Delivery Box -->
    <!-- Top Face (Bright Cyan) -->
    <polygon points="30,12 48,21 30,30 12,21" fill="#46d5f8" />
    
    <!-- Right Face (Deep Blue / Shadow) -->
    <polygon points="48,21 48,43 30,52 30,30" fill="#0077b6" />
    
    <!-- Left / Front Face (Dark Charcoal / Base with V) -->
    <polygon points="12,21 30,30 30,52 12,43" fill="#1b263b" />
    
    <!-- White 'V' glyph on the isometric front -->
    <path
      d="M 18 30 L 23 44 L 28 30"
      fill="none"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Valmo Wordmark in Deep Indigo Blue as shown in user reference -->
  <text x="82" y="44" fill="#0d1b69" font-size="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="600" letter-spacing="-0.5">Valmo</text>
</svg>
